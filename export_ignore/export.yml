export_root: "res://addons/gdaddon/export_ignore/exports"
plugin_folder: "Gdaddon{{version=res://addons/gdaddon}}"
pre_script: ""
post_script: ""
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: false
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: false
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      optimizer:
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
        debug_tags: false
        enabled: false
      class_rename_ignore: [GDAddonPlugin]
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/gdaddon"
    export_name: "gdaddon{{version=res://addons/gdaddon}}"
    export_folder: addons/gdaddon
    exclude:
      directories:
        - "res://addons/gdaddon/export_ignore"
      file_extensions: []
      files: []
    other_transfers: []
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
    remote_dir: "res://addons/gdaddon/src/remote"
